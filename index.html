<script>
(()=>{'use strict';
const SEED=JSON.parse(document.getElementById('initialData').textContent);
const SELECT_KEY='bank_asset_playbook_selection_v2';
function deep(x){return JSON.parse(JSON.stringify(x));}
let db=deep(SEED); db.photos=SEED.photos;
let selections=new Set();try{selections=new Set(JSON.parse(localStorage.getItem(SELECT_KEY)||'[]'));}catch(e){}
let state={chapter:'asset',stage:'all',view:'overview',search:'',status:'all',source:'all',expand:new Set(),matchResults:[],sort:'stage'};
const $=q=>document.querySelector(q); const $$=q=>[...document.querySelectorAll(q)]; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>db.chapters.find(x=>x.id===state.chapter)||db.chapters[0];
const methods=c=>c.stages.flatMap(s=>s.methods.map(m=>({...m,stageId:s.id,stageName:s.name}))) ;
const stageOf=(id,c=current())=>c.stages.find(s=>s.methods.some(m=>m.id===id));
const findMethod=(id)=>{for(const c of db.chapters)for(const s of c.stages)for(const m of s.methods)if(m.id===id)return {c,s,m};return null;};
const count=(c=current())=>c.stages.reduce((n,s)=>n+s.methods.length,0);
const pill=(text,type='gray')=>`<span class="pill ${type}">${esc(text)}</span>`;
const statusType=x=>x==='已整理'?'green':x==='待补充'?'amber':'blue';
const sourceType=x=>x==='会议明确'?'green':x==='手稿提炼'?'blue':x==='建议模板'?'amber':'purple';
let toastTimeout;function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),3000)}

const remote={version:0,csrf:'',me:null,saved:'',busy:false,conflict:false,timer:null,offline:false,working:false};
const canEdit=()=>remote.me && ['editor','admin'].includes(remote.me.role);
function showSync(kind,msg){
  const lbl=$('#syncLabel');if(lbl){lbl.textContent=msg;lbl.style.color=kind==='danger'?'#b23b24':kind==='pending'?'#b17625':'#1e7666';}
  const banner=$('#syncBanner');if(banner){banner.hidden=kind!=='danger';$('#syncMessage').textContent=kind==='danger'?msg:'';}
}
function markSynced(){showSync('ok',`● 云端已同步 · v${remote.version}`)}
function save(){
  try{localStorage.setItem(SELECT_KEY,JSON.stringify([...selections]));}catch(e){}
  const content=JSON.stringify(db.chapters);
  if(content===remote.saved)return;
  if(!canEdit()){notify('当前账户为只读权限');return;}
  if(remote.conflict){showSync('danger','云端存在其他人的修改。当前内容尚未同步，请先导出草稿并获取最新版本。');return;}
  showSync('pending','◌ 正在保存到云端…');
  clearTimeout(remote.timer);remote.timer=setTimeout(flush,500);
}
async function api(path,opts={}){
  const options={credentials:'same-origin',...opts};
  if(options.body){options.headers={'Content-Type':'application/json','X-CSRF-Token':remote.csrf,...(options.headers||{})};}
  else if(options.method && options.method!=='GET') options.headers={'X-CSRF-Token':remote.csrf,...(options.headers||{})};
  let res=await fetch(path,options);
  if(res.status===401){window.location.assign('/login');throw Error('登录已失效');}
  const data=await res.json().catch(()=>({}));
  if(!res.ok){const e=new Error(typeof data.detail==='string'?data.detail:data.message||'请求失败');e.status=res.status;e.data=data;throw e;}
  return data;
}
async function flush(){
  if(remote.busy||remote.conflict||!canEdit())return;
  const content=JSON.stringify(db.chapters);
  if(content===remote.saved){markSynced();return;}
  remote.busy=true;
  try{
    const r=await api('/api/knowledge',{method:'PUT',body:JSON.stringify({version:remote.version,chapters:JSON.parse(content),summary:'更新方法论：'+(current()?.name||'知识库')})});
    remote.version=r.version;remote.saved=content;remote.offline=false;
    if(JSON.stringify(db.chapters)!==remote.saved){remote.busy=false;save();return;}
    markSynced();
  }catch(err){
    if(err.status===409){remote.conflict=true;showSync('danger','有其他编辑者先行保存了新版本。当前更改尚未同步，请导出草稿，再重新获取云端版本。');}
    else{remote.offline=true;showSync('danger','云端保存失败：'+err.message+'。当前更改尚未同步，请导出草稿，待网络恢复后重试。');}
  }finally{remote.busy=false;}
}
async function loadRemote({force=false}={}){
  const localChanged=JSON.stringify(db.chapters)!==remote.saved;
  if(localChanged && !force){showSync('danger','当前有未同步的更改，请先导出草稿。');return;}
  let data=await api('/api/bootstrap');
  remote.me=data.me;remote.csrf=data.csrf;remote.version=data.version;
  db={chapters:data.chapters,photos:SEED.photos,version:'2.0'};
  remote.saved=JSON.stringify(db.chapters);remote.conflict=false;remote.offline=false;
  document.body.dataset.role=remote.me.role;
  $('#accountLabel').textContent=remote.me.username+' · '+({admin:'管理员',editor:'编辑',viewer:'只读'}[remote.me.role]||remote.me.role);
  $('#adminLink').hidden=remote.me.role!=='admin';
  state.chapter=db.chapters.some(c=>c.id===state.chapter)?state.chapter:db.chapters[0]?.id;
  selections=new Set([...selections].filter(id=>!!findMethod(id)));
  markSynced();render();
}
function downloadDraft(){const payload={version:remote.version,chapters:db.chapters,unsynced:true,exported_at:new Date().toISOString()};download('经营方法论_未同步草稿.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');}
async function refreshVersion(){
  if(remote.busy||remote.conflict||!remote.me)return;
  try{
    const data=await api('/api/version');
    if(data.version!==remote.version){
      if(JSON.stringify(db.chapters)!==remote.saved){remote.conflict=true;showSync('danger','其他协作者已发布新版本；请备份当前未同步草稿。');}
      else if($('#overlay')?.classList.contains('open')){showSync('pending','● 有云端新版本，关闭编辑窗口后可刷新页面');}
      else {await loadRemote({force:true});notify('已同步其他协作者的最新修改');}
    }
  }catch(e){}
}

function composer(c){return `<div class="row-head"><div><h2>策略组合器</h2><p>面对真实资产攻坚场景，从每个环节选出一组方法，而不是只依赖单点经验</p></div><div class="toolbar"><button class="button sm" data-action="clearChoices">清空当前组合</button><button class="button primary sm" data-action="downloadPlan">⇩ 导出推进方案</button></div></div><div class="composer-layout"><div class="panel"><h3>① 选择可用方法 <span class="muted tiny">（${methods(c).length} 个）</span></h3><div class="choice-list">${chooserList(c)||'<div style="padding:20px" class="muted">请先创建环节与方法。</div>'}</div><div class="linebreak"></div><h3>② 场景匹配 <span class="pill blue">规则匹配 · 非大模型</span></h3><div class="form-group"><label class="form-label">当前重点任务</label><select id="scenarioGoal" class="field"><option value="新增资产">寻找新增资产、业务突破口</option><option value="组织上报">组织上报、转化项目储备</option><option value="审批推进">提高审批材料质量与协同效率</option><option value="贷款投放">推动已批项目实际投放</option><option value="综合收益">提高贷后综合收益和客户粘性</option></select></div><div class="form-group"><label class="form-label">当前业务难点或客户情况</label><textarea id="scenarioText" class="field" rows="2" placeholder="例如：集团客户覆盖较好，但子公司贷款渗透不足；新项目上报慢……"></textarea></div><button class="button" data-action="match">✦ 推荐匹配方法</button><div id="matchBox"></div></div><div class="panel"><h3>③ 我的组合方案 <span class="pill green" id="selectedCount">${methods(c).filter(m=>selections.has(m.id)).length} 项</span></h3><div class="form-group"><label class="form-label">方案名称</label><input id="planName" class="field" placeholder="例如：重点行业资产突破专项方案" value="${esc(c.name+'专项推进方案')}" /></div><div id="planPreview">${selectedPlan(c)}</div><div class="linebreak"></div><div class="toolbar"><button class="button primary" data-action="downloadPlan">⇩ 导出 Markdown</button><button class="button" data-action="copyPlan">复制方案文本</button><button class="button" data-action="print">打印视图</button></div><p class="tiny muted" style="margin-top:12px">已选方法保存在当前浏览器。导出的推进方案包含关键动作、总分行承接、检视指标和风险提示。</p></div></div>`}
function alignment(c){const rows=methods(c);return `<div class="row-head"><div><h2>总行要求与分行承接</h2><p>避免只列“分行动作”，同时展示对应的上层政策来源与下层执行责任</p></div><button class="button sm" data-action="downloadAlignment">⇩ 导出对照表 CSV</button></div><div class="notice">以下“总行动作”多数为方法论映射的<b>待核对口径</b>，不是对现行总行制度的确认。落地前请补充正式文件名称、文号、发布时间及适用范围。</div><div class="matrix-wrap" style="margin-top:16px"><table class="matrix"><thead><tr><th>环节 / 方法</th><th>总行政策 / 动作（待核实）</th><th>分行承接动作</th><th>责任 / 输出</th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${esc(m.title)}</b><div class="tiny muted">${esc(m.stageName)} · ${esc(m.source)}</div></td><td>${esc(m.ho||'待补充')}</td><td>${esc(m.branch||'待补充')}</td><td><b>${esc(m.lead||'待补充')}</b><div class="tiny muted">${esc(m.deliver||'待补充')}</div></td></tr>`).join('')||'<tr><td colspan="4">暂无数据</td></tr>'}</tbody></table></div>`}
function sourcePage(c){return `<div class="row-head"><div><h2>原始资料与内容管理</h2><p>保留手稿来源，支持独立扩展章节、备份知识库</p></div><div class="toolbar"><button class="button sm" data-action="addStage">＋ 二级章节</button><button class="button sm" data-action="editChapter">编辑一级章节</button></div></div><div class="panel"><h3>原始手稿（点击放大）</h3><div class="source-grid">${db.photos.map((p,i)=>`<div class="source-img" data-photo="${i}"><img src="${p.src}" alt="${esc(p.label)}" loading="lazy"/><div class="source-caption"><b>${esc(p.label)}</b><span>${esc(p.desc)}</span></div></div>`).join('')}</div><div class="notice">手稿个别文字较难辨认；方法卡片中已经将可确认内容和推演内容分开标注，建议由原作者二次校对。</div></div><div class="two-col"><div class="panel"><h3>会议中明确的设计原则</h3><div class="source-quote">“由过去的经验总结，变成一张可以按参与主体、组织形式和考核激励来选择与组合的方法论网。”</div><div class="layer"><div class="layer-n">1</div><div><strong>不止罗列经验</strong><span>对每个经验补齐具体动作、牵头人、成果与指标</span></div></div><div class="layer"><div class="layer-n">2</div><div><strong>明确总分行上下对应</strong><span>总行如何做，分行如何承接，团队如何执行</span></div></div><div class="layer"><div class="layer-n">3</div><div><strong>方法可以组合</strong><span>存量/增量考核、挂牌督办、专项资源等根据场景灵活选用</span></div></div><div class="layer"><div class="layer-n">4</div><div><strong>持续校验、持续补充</strong><span>投放与综合收益章节仍需按实际业务补齐</span></div></div></div><div class="panel"><h3>知识库数据管理</h3><p class="small muted">编辑内容保存至服务器共享数据库，保存成功后其他用户刷新或自动同步即可看到最新内容。系统保留历史版本；策略组合选择只保存在您的当前浏览器中。</p><div class="toolbar" style="margin:20px 0"><button class="button primary" data-action="exportJson">⇩ 导出知识库 JSON</button><button class="button" data-action="importJson">⇧ 导入备份</button><input type="file" id="importInput" accept=".json,application/json" hidden /></div><div class="linebreak"></div><h3>管理当前章节</h3><p class="small muted">${esc(c.name)} · ${c.stages.length} 个二级章节 · ${count(c)} 条方法</p>${c.stages.map((s,i)=>`<div class="layer"><div class="layer-n">${i+1}</div><div style="flex:1"><strong>${esc(s.name)}</strong><span>${s.methods.length} 种方法 · ${esc(s.status||'待完善')}</span></div><button class="button sm" data-edit-stage="${esc(s.id)}">编辑</button></div>`).join('')||'<div class="muted small">暂无二级章节</div>'}<div class="linebreak"></div><div class="toolbar"><button class="button sm" data-action="resetSeed">恢复初始示例数据</button><button class="button danger sm" data-action="deleteChapter">删除当前章节</button></div><p class="tiny muted">恢复初始数据会覆盖本地修改。请在操作前导出备份。</p></div></div>`}
function render(){const c=current();if(!c){state.chapter=db.chapters[0]?.id;return}renderNav();let body=state.view==='overview'?overview(c):state.view==='library'?library(c):state.view==='matrix'?matrix(c):state.view==='composer'?composer(c):state.view==='alignment'?alignment(c):sourcePage(c);$('#content').innerHTML=(state.view!=='overview'?`<div class="small muted" style="margin-bottom:5px">${esc(c.name)}　/　方法论工作台</div>`:'')+(state.view==='overview'?'':viewTabs())+body+(state.view==='overview'?viewTabs():'')+`<div class="content-footer"><span>经营方法论中枢 · V2.0 共享版 · 资料来源：用户提供的手稿与会议转写材料</span><span>演示/方法沉淀工具，不替代授信政策、授权及合规审批</span></div>`;bindInputs();}
function bindInputs(){let search=$('#searchMethods');if(search)search.oninput=ev=>{state.search=ev.target.value;const pos=ev.target.selectionStart;const focused=true;render();let el=$('#searchMethods');if(el){el.focus();el.setSelectionRange(pos,pos)}};let st=$('#statusFilter');if(st)st.onchange=e=>{state.status=e.target.value;render()};let src=$('#sourceFilter');if(src)src.onchange=e=>{state.source=e.target.value;render()};$$('[data-select-method]').forEach(el=>el.onchange=e=>{const id=el.dataset.selectMethod;e.target.checked?selections.add(id):selections.delete(id);save();const node=$('#planPreview');if(node)node.innerHTML=selectedPlan(current());const badge=$('#selectedCount');if(badge)badge.textContent=methods(current()).filter(x=>selections.has(x.id)).length+' 项';});let inp=$('#importInput');if(inp)inp.onchange=async(e)=>{let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.chapters)||!obj.chapters.every(c=>Array.isArray(c.stages)))throw Error('文件格式不匹配');if(!canEdit())return notify('当前账户无法导入');if(!confirm('确定用导入数据覆盖服务器上的共享方法库吗？这会影响所有用户，请先导出云端备份。'))return;db={chapters:obj.chapters,photos:SEED.photos,version:'1.0'};selections.clear();state.chapter=db.chapters[0]?.id;state.stage='all';state.view='overview';save();render();notify('知识库已导入')}catch(err){alert('导入失败：'+err.message)}}}
function setView(v){state.view=v;state.expand=new Set();render();window.scrollTo({top:0,behavior:'smooth'})}
function setStage(s){state.stage=s;state.view='library';state.search='';state.status='all';state.source='all';render();window.scrollTo({top:0,behavior:'smooth'})}
function setChapter(id){if(!db.chapters.some(c=>c.id===id))return;state.chapter=id;state.stage='all';state.view='overview';state.search='';$('#sidebar').classList.remove('mobile-open');render();window.scrollTo({top:0,behavior:'smooth'})}
function openModal(title,body,foot){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot||`<button class="button" id="cancelModal">取消</button><button class="button primary" id="submitModal">保存</button>`;$('#overlay').classList.add('open');$('#cancelModal')?.addEventListener('click',closeModal);}
function closeModal(){$('#overlay').classList.remove('open')}
function textField(label,name,val='',opt={}){return `<div class="form-group"><label class="form-label" for="f_${name}">${esc(label)}</label>${opt.multiline?`<textarea class="field" id="f_${name}" rows="${opt.rows||2}" placeholder="${esc(opt.placeholder||'')}" ${opt.required?'required':''}>${esc(val)}</textarea>`:`<input class="field" id="f_${name}" value="${esc(val)}" placeholder="${esc(opt.placeholder||'')}" ${opt.required?'required':''}/>`}</div>`}
function value(name){return ($('#f_'+name)?.value||'').trim()}
function editChapter(){if(!canEdit())return notify('当前为只读账号');const c=current();openModal('编辑一级章节',textField('章节名称','name',c.name,{required:true})+textField('章节副标题','subtitle',c.subtitle)+textField('章节介绍','description',c.description,{multiline:true}),null);$('#submitModal').onclick=()=>{if(!value('name'))return notify('请填写章节名称');c.name=value('name');c.subtitle=value('subtitle');c.description=value('description');save();closeModal();render();notify('已保存章节')}}
function addChapter(){if(!canEdit())return notify('当前为只读账号');openModal('新增一级章节',textField('章节名称','name','',{required:true,placeholder:'如：交易银行业务方法论'})+textField('副标题','subtitle','',{placeholder:'如：基础拓客 → 客户经营 → 收益提升'})+textField('章节简介','description','',{multiline:true,placeholder:'介绍这一类方法论希望解决的问题'}));$('#submitModal').onclick=()=>{if(!value('name'))return notify('请输入名称');let id='chapter_'+Date.now();db.chapters.push({id,name:value('name'),subtitle:value('subtitle')||'自定义方法论章节',description:value('description')||'可自行新增二级章节和具体方法。',stages:[],placeholder:false});save();closeModal();setChapter(id);notify('一级章节已创建')}}
function addStage(id=null){if(!canEdit())return notify('当前为只读账号');const c=current(),s=id?c.stages.find(x=>x.id===id):null;openModal(s?'编辑二级章节':'新增二级章节',textField('小章节名称','name',s?.name||'',{required:true,placeholder:'如：客户营销、贷款上报、审批'})+textField('简要说明','desc',s?.desc||'',{multiline:true})+`<div class="form-row"><div class="form-group"><label class="form-label">完善状态</label><select id="f_stageStatus" class="field"><option ${s?.status==='已形成框架'?'selected':''}>已形成框架</option><option ${s?.status==='待校对手稿'?'selected':''}>待校对手稿</option><option ${!s||s.status==='待领导补充'?'selected':''}>待领导补充</option></select></div></div>`,(s?`<button class="button danger" id="deleteStageBtn" style="margin-right:auto">删除小章节</button>`:'')+`<button class="button" id="cancelModal">取消</button><button class="button primary" id="submitModal">保存</button>`);$('#cancelModal').onclick=closeModal;if(s)$('#deleteStageBtn').onclick=()=>{if(s.methods.length&&!confirm('此小章节包含 '+s.methods.length+' 条方法，删除后无法恢复。确定删除？'))return;if(!s.methods.length&&!confirm('确定删除此小章节？'))return;c.stages=c.stages.filter(x=>x.id!==s.id);selections=new Set([...selections].filter(id=>!!findMethod(id)));save();closeModal();render();notify('已删除小章节')};$('#submitModal').onclick=()=>{if(!value('name'))return notify('请填写小章节名');if(s){s.name=value('name');s.desc=value('desc');s.status=$('#f_stageStatus').value}else c.stages.push({id:'stage_'+Date.now(),name:value('name'),alias:'',desc:value('desc'),status:$('#f_stageStatus').value,methods:[]});save();closeModal();render();notify('小章节已保存')}}
function editMethod(id=null){if(!canEdit())return notify('当前为只读账号');const found=id?findMethod(id):null;const c=current(),m=found?.m||{},stage=found?.s||c.stages.find(s=>s.id===state.stage)||c.stages[0];if(!c.stages.length){notify('请先创建一个二级章节');addStage();return;}let body=`<div class="form-row three"><div class="form-group"><label class="form-label">所属小章节</label><select class="field" id="f_stage">${c.stages.map(s=>`<option value="${esc(s.id)}" ${stage?.id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">内容来源</label><select class="field" id="f_source">${['自定义','会议明确','手稿提炼','整理推演','建议模板'].map(x=>`<option ${m.source===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">核实状态</label><select class="field" id="f_status">${['已整理','待核实','待补充'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-row">${textField('方法名称','title',m.title||'',{required:true})}${textField('方法维度','dimension',m.dimension||'',{placeholder:'组织形式 / 激励考核 / 政策来源'})}</div><div class="form-row">${textField('牵头主体','lead',m.lead||'')}${textField('参与角色','actors',m.actors||'')}</div>${textField('适用情形 / 触发条件','triggers',m.triggers||'',{multiline:true})}${textField('具体执行动作（每行一条）','actions',(m.actions||[]).join('\n'),{multiline:true,rows:5})}<div class="form-row">${textField('总行政策或动作','ho',m.ho||'',{multiline:true,rows:3})}${textField('分行承接动作','branch',m.branch||'',{multiline:true,rows:3})}</div><div class="form-row">${textField('工作产出','deliver',m.deliver||'')}${textField('检视指标','metric',m.metric||'')}</div>${textField('风险及注意事项','risk',m.risk||'',{multiline:true})}${textField('标签（逗号隔开）','tags',(m.tags||[]).join('，'))}${textField('补充说明','note',m.note||'',{multiline:true})}`;
let footer=(id?'<button class="button danger" id="deleteMethodBtn" style="margin-right:auto">删除方法</button>':'')+'<button class="button" id="cancelModal">取消</button><button class="button primary" id="submitModal">保存方法</button>';openModal(id?'编辑方法卡片':'新增方法卡片',body,footer);$('#cancelModal').onclick=closeModal;if(id)$('#deleteMethodBtn').onclick=()=>{if(!confirm('确定删除该方法？'))return;found.s.methods=found.s.methods.filter(x=>x.id!==id);selections.delete(id);save();closeModal();render();notify('方法已删除')};$('#submitModal').onclick=()=>{if(!value('title'))return notify('请输入方法名称');let newstage=c.stages.find(s=>s.id===$('#f_stage').value);if(!newstage)return;let data={id:m.id||'method_'+Date.now(),title:value('title'),dimension:value('dimension')||'未分类',source:$('#f_source').value,status:$('#f_status').value,lead:value('lead'),actors:value('actors'),triggers:value('triggers'),actions:value('actions').split(/\n/).map(s=>s.trim()).filter(Boolean),ho:value('ho'),branch:value('branch'),deliver:value('deliver'),metric:value('metric'),risk:value('risk'),tags:value('tags').split(/[,，、]/).map(s=>s.trim()).filter(Boolean),note:value('note')};if(found){found.s.methods=found.s.methods.filter(x=>x.id!==id)}newstage.methods.push(data);save();closeModal();render();notify(id?'方法已更新':'方法已新增')}}
function choose(id){const yes=selections.has(id);yes?selections.delete(id):selections.add(id);save();render();notify(yes?'已从组合移除':'已加入策略组合')}
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}
function download(name,text,mime='text/plain;charset=utf-8'){const a=document.createElement('a');const blob=new Blob(['\ufeff',text],{type:mime});const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportJson(){const copy=deep(db);delete copy.photos;download('经营方法论知识库备份.json',JSON.stringify(copy,null,2),'application/json;charset=utf-8');notify('已导出 JSON 备份')}
function getPlanText(){const c=current();const n=$('#planName')?.value?.trim()||c.name+'专项推进方案';let buf=['# '+n,'','> 基于方法论中枢生成的备选推进方案；请按实际政策、审批权限和客户情况审核。',''];let all=methods(c).filter(m=>selections.has(m.id));if(!all.length)return buf.concat(['当前尚无已选方法。']).join('\n');c.stages.forEach((s,i)=>{const arr=all.filter(m=>m.stageId===s.id);if(!arr.length)return;buf.push(`## ${i+1}. ${s.name}`,'');arr.forEach(m=>{buf.push(`### ${m.title}`,'',`- 分类：${m.dimension}｜来源：${m.source}｜状态：${m.status}`,`- 牵头：${m.lead||'待落实'}`,`- 参与角色：${m.actors||'待落实'}`,`- 触发情形：${m.triggers||'待落实'}`,'- 执行动作：',...m.actions.map((a,j)=>`  ${j+1}. ${a}`),`- 总行动作/要求：${m.ho||'待核实'}`,`- 分行承接：${m.branch||'待制定'}`,`- 交付成果：${m.deliver||'待确定'}`,`- 检视指标：${m.metric||'待确定'}`,`- 风险提示：${m.risk||'按现行制度执行'}`,'')})});buf.push('---','本方案系内部方法整理及行动建议，不等同于正式政策或项目审批意见。');return buf.join('\n')}
function downloadPlan(){download('资产方法论_组合推进方案.md',getPlanText(),'text/markdown;charset=utf-8');notify('已导出组合方案')}
function downloadAlignment(){const c=current();let buf=[['业务环节','方法','来源','核实状态','总行动作/要求','分行承接','牵头主体','工作产出']];methods(c).forEach(m=>buf.push([m.stageName,m.title,m.source,m.status,m.ho,m.branch,m.lead,m.deliver]));download(c.name+'_总分行承接对照表.csv',buf.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function match(){const goal=$('#scenarioGoal')?.value||'新增资产',txt=$('#scenarioText')?.value||'';let goalStage={'新增资产':'direction','组织上报':'report','审批推进':'approval','贷款投放':'disburse','综合收益':'post'}[goal];const keywords=txt.split(/[\s，。；、:：;！!,.\n]/).filter(t=>t.length>1);let arr=methods(current()).map(m=>{const search=[m.title,m.dimension,m.triggers,m.lead,m.branch,...m.tags].join('');let score=m.stageId===goalStage?6:0;for(let t of keywords)if(search.includes(t))score+=3;let broad={'新增资产':['市场','行业','客户','政策','产品','线索'],'组织上报':['专班','督办','任务','考核'],'审批推进':['审批','材料','风险','补件'],'贷款投放':['放款','投放','条件'],'综合收益':['综合收益','结算','贷后','客户']}[goal];for(let word of broad)if(search.includes(word))score+=1;if(m.status==='已整理')score+=1;return{m,score}}).filter(z=>z.score>0).sort((a,b)=>b.score-a.score).slice(0,6);state.matchResults=arr.map(x=>x.m.id);$('#matchBox').innerHTML=`<div class="notice note-blue"><b>匹配到 ${arr.length} 种方法</b><div style="margin-top:7px">${arr.map(z=>`<div style="margin:5px 0">${pill(z.m.stageName,'blue')} ${esc(z.m.title)} <span class="tiny muted">（${esc(z.m.status)}）</span></div>`).join('')}</div><button class="button sm primary" data-action="addMatched" style="margin-top:10px">将这 ${arr.length} 项加入组合</button></div>`}
function handleClick(ev){const t=ev.target.closest('[data-chapter],[data-view],[data-stagego],[data-stage],[data-expand],[data-edit-method],[data-choose],[data-open-method],[data-edit-stage],[data-photo],[data-action]');if(!t)return;if(!canEdit()&&(t.dataset.editMethod||t.dataset.editStage||['addStage','addMethod','editChapter','importJson','resetSeed','deleteChapter'].includes(t.dataset.action)))return notify('当前账户为只读权限');if(t.dataset.chapter)return setChapter(t.dataset.chapter);if(t.dataset.view)return setView(t.dataset.view);if(t.dataset.stagego)return setStage(t.dataset.stagego);if(t.dataset.stage)return setStage(t.dataset.stage);if(t.dataset.expand){state.expand.has(t.dataset.expand)?state.expand.delete(t.dataset.expand):state.expand.add(t.dataset.expand);let p=$('#searchMethods')?.selectionStart;render();return}if(t.dataset.editMethod)return editMethod(t.dataset.editMethod);if(t.dataset.choose)return choose(t.dataset.choose);if(t.dataset.openMethod){const f=findMethod(t.dataset.openMethod);if(f){state.stage=f.s.id;state.search=f.m.title;state.view='library';state.expand.add(f.m.id);render();window.scrollTo({top:0,behavior:'smooth'})}return}if(t.dataset.editStage)return addStage(t.dataset.editStage);if(t.dataset.photo!==undefined){$('#photoLarge').src=db.photos[Number(t.dataset.photo)].src;$('#photoOverlay').classList.add('open');return;}switch(t.dataset.action){case'goLibrary':return setView('library');case'goComposer':return setView('composer');case'goSources':return setView('sources');case'addStage':return addStage();case'addMethod':return editMethod();case'editChapter':return editChapter();case'resetFilters':state.search='';state.stage='all';state.status='all';state.source='all';return render();case'clearChoices':if(!selections.size)return; if(confirm('确定清空已选方法？')){selections.clear();save();render()}return;case'downloadPlan':return downloadPlan();case'copyPlan':{let txt=getPlanText();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>notify('方案已复制'),()=>prompt('请复制方案文本',txt));else prompt('请复制方案文本',txt);return}case'print':return window.print();case'match':return match();case'addMatched':state.matchResults.forEach(x=>selections.add(x));save();return render();case'downloadAlignment':return downloadAlignment();case'exportJson':return exportJson();case'importJson':return $('#importInput')?.click();case'resetSeed':if(remote.me.role!=='admin')return notify('仅管理员能恢复模板');if(!confirm('确定用原始模板覆盖整个共享知识库？此操作会影响所有用户，请先导出备份。'))return;db=deep(SEED);selections.clear();state.chapter='asset';state.stage='all';state.view='overview';save();render();notify('已提交恢复模板，请检查云端同步状态');return;case'deleteChapter':if(db.chapters.length<=1)return notify('至少保留一个一级章节');if(!confirm(`确定删除“${current().name}”及其所有小章节和方法吗？此操作不可撤销。`))return;db.chapters=db.chapters.filter(c=>c.id!==state.chapter);state.chapter=db.chapters[0].id;state.view='overview';state.stage='all';selections=new Set([...selections].filter(x=>!!findMethod(x)));save();render();notify('章节已删除');return}}
document.addEventListener('click',handleClick);$('#addChapterSide').onclick=addChapter;$('#newMethodTop').onclick=()=>editMethod();$('#exportQuick').onclick=exportJson;$('#closeModal').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};$('#toggleNav').onclick=()=>$('#sidebar').classList.toggle('mobile-open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#photoOverlay').classList.remove('open');$('#sidebar').classList.remove('mobile-open')}});$('#logoutBtn').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch(e){}window.location.assign('/login')};$('#backupDraft').onclick=downloadDraft;$('#reloadRemote').onclick=async()=>{if(JSON.stringify(db.chapters)!==remote.saved&&!confirm('当前存在未同步修改。重新加载将丢失这些修改，建议先导出草稿。确定继续？'))return;try{await loadRemote({force:true})}catch(e){notify('获取云端失败：'+e.message)}};window.addEventListener('beforeunload',ev=>{if(JSON.stringify(db.chapters)!==remote.saved){ev.preventDefault();ev.returnValue='';}});loadRemote({force:true}).then(()=>setInterval(refreshVersion,20000)).catch(err=>{showSync('danger','连接共享数据库失败：'+err.message);notify('页面未能加载，请刷新重试')});
})();
</script></body></html>
