<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成员权限 · 经营方法论中枢</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f8;color:#1c3039;font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.header{background:#112b3c;color:#fff;padding:25px max(30px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.header h1{font-size:25px;margin:0}.header a{color:#a3e0d3;text-decoration:none}.wrap{max-width:1120px;margin:35px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e3ebed;border-radius:15px;padding:25px;margin-bottom:20px;overflow:auto}h2{margin:0 0 12px;font-size:21px}p{color:#687d85}table{border-collapse:collapse;width:100%;min-width:650px;text-align:left}td,th{padding:14px;border-bottom:1px solid #ecf1f3}th{font-size:12px;color:#667d85}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{font-size:12px;display:flex;flex-direction:column;gap:6px;font-weight:700}input,select{border:1px solid #cbdadd;border-radius:8px;padding:10px;font:inherit;min-width:160px}button{cursor:pointer;background:#00877e;border:0;border-radius:8px;color:#fff;font-weight:700;padding:11px 15px}button.alt{color:#31545c;background:#e7eff1}button.warn{background:#a65c32}button:disabled{opacity:.4}.status{margin-top:10px;color:#006e65;min-height:25px}.active{color:#008777}.inactive{color:#be5944}.min{font-size:12px;color:#667d85}@media(max-width:650px){.header{padding:22px}.header h1{font-size:19px}.wrap{margin:20px auto}.panel{padding:18px}}
</style></head><body><header class="header"><div><h1>用户与权限管理</h1><div class="min" style="color:#a3beca">管理员专用 · 账号与角色</div></div><div><a href="/">返回方法论中枢</a>　<a href="/history">修改历史</a></div></header><main class="wrap"><section class="panel"><h2>新增成员</h2><p>管理员可创建账号。编辑者可以修改知识库；查看者只能浏览、查询、导出。</p><form id="create" class="controls"><label>账号<input id="newUser" required pattern="[A-Za-z0-9_.@-]{3,64}" placeholder="例如：team_editor"></label><label>初始密码（12位以上）<input id="newPass" required minlength="12" maxlength="128" type="password" placeholder="请使用独立强密码"></label><label>角色<select id="newRole"><option value="viewer">查看者</option><option value="editor">编辑者</option><option value="admin">管理员</option></select></label><button type="submit">创建账号</button></form><div class="status" id="status"></div></section><section class="panel"><h2>现有成员</h2><p>停用账号后立即撤销其登录权限。重置密码后所有旧会话失效。</p><div id="users">加载中…</div></section><section class="panel"><h2>角色说明</h2><p><b>管理员：</b>管理人员账号、分配角色、查看和恢复历史版本，拥有编辑权限。</p><p><b>编辑者：</b>新增章节、编辑方法、维护内容；不能管理用户或恢复历史版本。</p><p><b>查看者：</b>浏览、检索、组合和导出方法；无法更改共享数据库。</p></section></main><script>
const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let csrf='',me={};async function api(path,opts={}){const headers={...(opts.headers||{})};if(opts.method&&opts.method!=='GET')headers['X-CSRF-Token']=csrf;if(opts.body)headers['Content-Type']='application/json';const r=await fetch(path,{credentials:'same-origin',...opts,headers});if(r.status===401){location.href='/login';throw Error('请先登录')}const data=await r.json();if(!r.ok)throw Error(data.detail||data.message||'操作失败');return data}function say(t){$('#status').textContent=t}async function load(){const b=await api('/api/bootstrap');me=b.me;csrf=b.csrf;if(me.role!=='admin'){location.href='/';return}const r=await api('/api/users');$('#users').innerHTML='<table><thead><tr><th>账号</th><th>角色</th><th>状态</th><th>创建日期</th><th>操作</th></tr></thead><tbody>'+r.items.map(x=>`<tr><td><b>${escapeHtml(x.username)}</b></td><td><select data-role="${escapeHtml(x.username)}"><option value="viewer" ${x.role==='viewer'?'selected':''}>查看者</option><option value="editor" ${x.role==='editor'?'selected':''}>编辑者</option><option value="admin" ${x.role==='admin'?'selected':''}>管理员</option></select></td><td class="${x.active?'active':'inactive'}">${x.active?'● 启用':'● 停用'}</td><td>${escapeHtml(x.created_at.split('T')[0])}</td><td><button class="alt" data-save="${escapeHtml(x.username)}">更新权限</button> <button class="alt" data-password="${escapeHtml(x.username)}">重置密码</button> <button class="warn" data-toggle="${escapeHtml(x.username)}" data-active="${x.active}">${x.active?'停用':'启用'}</button></td></tr>`).join('')+'</tbody></table>'}$('#create').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify({username:$('#newUser').value.trim(),password:$('#newPass').value,role:$('#newRole').value})});$('#newPass').value='';$('#newUser').value='';say('账号已创建');await load()}catch(err){say('失败：'+err.message)}};$('#users').onclick=async ev=>{const el=ev.target.closest('button');if(!el)return;const username=el.dataset.save||el.dataset.password||el.dataset.toggle;try{let payload={};if(el.dataset.save)payload.role=[...document.querySelectorAll('select[data-role]')].find(x=>x.dataset.role===username).value;if(el.dataset.password){const p=prompt(`请设置 ${username} 的新密码（12位以上）`);if(p===null)return;payload.password=p}if(el.dataset.toggle){const active=el.dataset.active==='1';if(!confirm(`确定${active?'停用':'启用'} ${username}？`))return;payload.active=!active}await api('/api/users/'+encodeURIComponent(username),{method:'PATCH',body:JSON.stringify(payload)});say('已保存 '+username+' 的设置');await load()}catch(err){say('失败：'+err.message)}};load().catch(err=>say('加载失败：'+err.message));
</script></body></html>
