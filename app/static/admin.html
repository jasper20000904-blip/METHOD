<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · 经营方法论中枢</title><style>
:root{font-family:ui-sans-serif,-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;color:#20313b;background:#f3f7f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh}a{color:#007b75;text-decoration:none}
main{max-width:1050px;margin:38px auto;padding:0 22px}.auth{max-width:440px;margin:8vh auto;padding:0 20px}
.card{background:white;border:1px solid #e2eaeb;border-radius:14px;padding:28px;box-shadow:0 9px 34px #29404b0c}
h1{font-size:26px;margin:0 0 9px}h2{font-size:20px;margin:0 0 15px}p{color:#60717c;line-height:1.6}
label{display:block;margin:16px 0 5px;font-weight:600;font-size:13px}input,select{width:100%;font:inherit;border:1px solid #cfdddf;border-radius:8px;padding:11px;background:white}
button,.btn{border:0;background:#007e78;color:white;padding:10px 17px;border-radius:8px;cursor:pointer;font:inherit}
button.secondary{background:#e5f3f1;color:#006b65}button.warn{background:#aa4f36}
button:disabled{opacity:.55} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}
.nav{background:#101f2f;color:white;padding:18px 24px;display:flex;align-items:center;gap:18px}.nav a{color:#d9eeee}
.muted{color:#73858d;font-size:13px}.err{color:#bc3e24}.good{color:#087e72}
table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e7eeee;padding:12px 7px;vertical-align:middle;font-size:14px}th{color:#6b7c85;font-weight:600}
td button{padding:5px 8px;font-size:12px}td select{min-width:106px;width:auto;padding:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){main{margin:18px auto}.card{padding:18px}.grid{grid-template-columns:1fr}.nav{flex-wrap:wrap}}
</style></head><body><div class="nav"><strong>经营方法论中枢</strong><a href="/">← 返回知识库</a><a href="/history">历史版本</a></div><main><h1>成员与权限管理</h1><p>管理员可创建用户、修改角色、重置密码和停用账号。密码至少12位，请单独发给授权同事。</p><section class="card"><h2>新增用户</h2><form id="create"><div class="grid"><div><label>用户名</label><input id="username" required pattern="[A-Za-z0-9_.@-]{3,64}"></div><div><label>角色</label><select id="role"><option value="viewer">查看者（只读）</option><option value="editor">编辑者</option><option value="admin">管理员</option></select></div></div><label>初始密码（至少12位）</label><input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><div style="margin-top:16px"><button type="submit">创建用户</button></div></form><p id="note" role="status"></p></section><section class="card" style="margin-top:20px"><h2>现有用户</h2><div style="overflow:auto"><table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>管理</th></tr></thead><tbody id="list"><tr><td>加载中…</td></tr></tbody></table></div></section></main><script>
let csrf='',me='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function req(url,opt={}){const headers={'content-type':'application/json',...(opt.method&&opt.method!=='GET'?{'x-csrf-token':csrf}:{}),...(opt.headers||{})};const r=await fetch(url,{credentials:'same-origin',...opt,headers});if(r.status===401)location.assign('/login');const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||j.message||'请求失败');return j}
async function refresh(){const x=await req('/api/users');$('#list').innerHTML=x.items.map(u=>'<tr><td><b>'+esc(u.username)+'</b></td><td><select data-user="'+esc(u.username)+'" data-role><option value="viewer" '+(u.role==='viewer'?'selected':'')+'>查看者</option><option value="editor" '+(u.role==='editor'?'selected':'')+'>编辑者</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>管理员</option></select></td><td>'+(u.active?'启用':'停用')+'</td><td><div class="row"><button class="secondary" data-pwd="'+esc(u.username)+'">重设密码</button><button class="'+(u.active?'warn':'secondary')+'" data-active="'+esc(u.username)+'" data-value="'+(u.active?'false':'true')+'">'+(u.active?'停用':'启用')+'</button></div></td></tr>').join('')}
$('#create').onsubmit=async ev=>{ev.preventDefault();try{await req('/api/users',{method:'POST',body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value,role:$('#role').value})});$('#password').value='';$('#note').textContent='账号已创建';$('#note').className='good';await refresh()}catch(e){$('#note').textContent=e.message;$('#note').className='err'}};
document.addEventListener('change',async ev=>{const t=ev.target;if(!t.matches('[data-role]'))return;try{await req('/api/users/'+encodeURIComponent(t.dataset.user),{method:'PATCH',body:JSON.stringify({role:t.value})});await refresh()}catch(e){alert(e.message);await refresh()}});
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-pwd],[data-active]');if(!b)return;try{if(b.dataset.pwd){const password=prompt('输入 '+b.dataset.pwd+' 的新密码（至少12位）');if(password===null)return;await req('/api/users/'+encodeURIComponent(b.dataset.pwd),{method:'PATCH',body:JSON.stringify({password})})}else{if(!confirm('确认修改用户 '+b.dataset.active+' 的启用状态？'))return;await req('/api/users/'+encodeURIComponent(b.dataset.active),{method:'PATCH',body:JSON.stringify({active:b.dataset.value==='true'})})}await refresh()}catch(e){alert(e.message)}});
(async()=>{try{const b=await req('/api/bootstrap');if(b.me.role!=='admin'){location.assign('/');return}me=b.me.username;csrf=b.csrf;await refresh()}catch(e){$('#note').textContent=e.message;$('#note').className='err'}})();
</script></body></html>
