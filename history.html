<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版本历史 · 经营方法论中枢</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f9;color:#1b303a;font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{background:#10293b;color:white;padding:24px max(26px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:24px}header a{color:#aadbd4;text-decoration:none}.wrap{max-width:1080px;margin:25px auto;padding:0 20px}.box{background:#fff;border:1px solid #e2eaed;border-radius:14px;padding:22px;margin:18px 0}p{color:#70818b}.timeline{display:grid;gap:12px}.revision{display:flex;gap:18px;justify-content:space-between;align-items:center;border:1px solid #e2e9e9;border-radius:11px;padding:17px}.badge{border-radius:6px;background:#e5f3f0;color:#007a73;padding:5px 10px;font-weight:800}.meta{color:#697c85;font-size:12px;margin-top:3px}button{background:#087e76;border:0;color:#fff;border-radius:8px;padding:10px 15px;cursor:pointer}button.alt{color:#29565c;background:#e8f1f2}button:disabled{opacity:.5}.danger{color:#a84f2c}#details{white-space:pre-wrap;max-height:450px;overflow:auto;font-size:12px;line-height:1.8;background:#f7fafb;padding:15px;border-radius:8px}#status{min-height:25px;color:#20786c}a{text-decoration:none}@media(max-width:700px){header{padding:20px}header h1{font-size:18px}.revision{align-items:flex-start;flex-direction:column}}
</style></head><body><header><h1>版本历史与恢复</h1><a href="/">返回方法论中枢</a></header><div class="wrap"><section class="box"><h2>云端版本记录</h2><p>每次成功提交都会新增记录。管理员可将任意历史版本作为一个新版本恢复，不会抹除既有记录。</p><div id="status"></div><div class="timeline" id="revisions">加载中…</div></section><section class="box" id="view" hidden><h2 id="vTitle">版本内容</h2><p>选择一条历史记录查看章节概要，亦可下载该版本 JSON。</p><div id="details"></div><div style="margin-top:15px"><button id="download">下载该版本 JSON</button> <button id="restore" class="alt" hidden>管理员：恢复为当前版本</button></div></section></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let csrf='',me={},selected=null;async function api(url,opts={}){let headers={...(opts.headers||{})};if(opts.method&&opts.method!=='GET')headers['X-CSRF-Token']=csrf;const r=await fetch(url,{credentials:'same-origin',...opts,headers});if(r.status===401){location.href='/login';throw Error('请登录')}const d=await r.json();if(!r.ok)throw Error(d.detail||d.message||'请求失败');return d}const say=s=>$('#status').textContent=s;async function load(){const b=await api('/api/bootstrap');me=b.me;csrf=b.csrf;const r=await api('/api/history');$('#revisions').innerHTML=r.items.map(x=>`<div class="revision"><div><span class="badge">v${x.version}</span>　<b>${esc(x.summary)}</b><div class="meta">${esc(x.author)} · ${esc(x.created_at.replace('T',' ').slice(0,19))} UTC</div></div><button class="alt" data-version="${x.version}">查看版本</button></div>`).join('')||'暂无记录'}$('#revisions').onclick=async e=>{const el=e.target.closest('[data-version]');if(!el)return;try{selected=await api('/api/history/'+el.dataset.version);$('#view').hidden=false;$('#vTitle').textContent='历史版本 v'+selected.version;$('#details').textContent=selected.chapters.map(c=>c.name+' ('+c.stages.length+' 个小章节，'+c.stages.reduce((x,s)=>x+s.methods.length,0)+' 条方法)').join('\n');$('#restore').hidden=me.role!=='admin';$('#view').scrollIntoView({behavior:'smooth'})}catch(err){say(err.message)}};$('#download').onclick=()=>{if(!selected)return;const blob=new Blob([JSON.stringify({version:selected.version,chapters:selected.chapters},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='方法论历史版本_v'+selected.version+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};$('#restore').onclick=async()=>{if(!selected||me.role!=='admin')return;if(!confirm(`确定把 v${selected.version} 恢复为新的当前版本？其他未保存的编辑将产生冲突。`))return;try{const r=await api('/api/history/'+selected.version+'/restore',{method:'POST'});say('已恢复为新版本 v'+r.version);await load()}catch(err){say('恢复失败：'+err.message)}};load().catch(e=>say(e.message))
</script></body></html>
