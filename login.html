<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 经营方法论中枢</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1c2b3c;background:#f2f6f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.intro{background:linear-gradient(145deg,#0b2638,#134b4c);color:white;padding:10vh min(7vw,110px);display:flex;flex-direction:column;justify-content:space-between}.icon{width:58px;height:58px;display:grid;place-items:center;background:#199887;border-radius:18px;font-size:32px}.intro h1{font-size:clamp(32px,3.5vw,51px);letter-spacing:1px;line-height:1.38;max-width:550px}.intro p{font-size:17px;line-height:1.9;color:#bdd8d4}.intro small{color:#94b5b8}.panel{display:grid;place-items:center;padding:35px}.card{width:100%;max-width:420px}.eyebrow{font-size:12px;letter-spacing:3px;color:#0d8f83;font-weight:800}.card h2{font-size:31px;margin:10px 0}.card p{color:#697b82;line-height:1.8;margin:0 0 34px}.field{width:100%;margin:8px 0 20px;padding:15px 16px;background:white;border:1px solid #d5e2e3;border-radius:11px;font-size:16px;outline:none}.field:focus{border-color:#15988e;box-shadow:0 0 0 3px #21a99c20}label{font-weight:700;font-size:13px;color:#445c68}button{border:0;border-radius:11px;padding:16px;background:#00877b;color:white;width:100%;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.err{min-height:32px;color:#b83d32;font-size:13px;padding-top:7px}.fine{font-size:12px;color:#8a989e;margin-top:24px;line-height:1.8}@media(max-width:780px){body{display:block}.intro{min-height:190px;padding:25px}.intro h1{font-size:25px;margin:15px 0 6px}.intro p{font-size:13px;margin:0}.intro small{display:none}.panel{padding:40px 25px}}
</style></head><body><section class="intro"><div><div class="icon">▤</div><h1>经营方法论中枢<br>把经验转化为可复用的行动体系</h1><p>资产业务投放 · 方法库 · 总分行承接 · 组合策略 · 持续沉淀</p></div><small>Methodology Knowledge Hub · 内部协作系统</small></section><section class="panel"><form class="card" id="form"><div class="eyebrow">TEAM WORKSPACE</div><h2>欢迎登录</h2><p>同一网址访问，所有成员共享最新的方法论知识库。</p><label for="username">账号</label><input class="field" id="username" name="username" autocomplete="username" required placeholder="请输入管理员分配的账号" autofocus><label for="password">密码</label><input class="field" type="password" id="password" name="password" autocomplete="current-password" required placeholder="请输入密码"><button id="submit">登录知识库</button><div class="err" id="err" role="alert" aria-live="polite"></div><div class="fine">首次使用请联系系统管理员创建账号。系统未开放公开注册；如需修改密码，请联系管理员。</div></form></section><script>
const f=document.getElementById('form'),e=document.getElementById('err'),b=document.getElementById('submit');f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;b.textContent='正在验证…';e.textContent='';try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'无法登录');window.location.replace('/')}catch(err){e.textContent=err.message;b.disabled=false;b.textContent='登录知识库'}};
</script></body></html>
